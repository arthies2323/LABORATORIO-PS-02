<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registrar - AutoRent</title>
  <link th:href="@{/css/register.css}" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <div class="register-card">
      <div class="logo-section">
        <div class="logo">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 17H4a2 2 0 01-2-2V5a2 2 0 012-2h16a2 2 0 012 2v10a2 2 0 01-2 2h-1"></path>
            <polygon points="12 15 17 21 7 21 12 15"></polygon>
          </svg>
        </div>
        <h1>Criar Conta</h1>
        <p class="subtitle">Registre-se no AutoRent</p>
      </div>
      
      <form th:action="@{/register}" th:object="${usuario}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        
        <div class="form-group">
          <label for="username">Usuário</label>
          <input th:field="*{username}" type="text" id="username" placeholder="Escolha um nome de usuário" required/>
          <div class="error-message" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Erro</div>
        </div>
        
        <div class="form-group">
          <label for="password">Senha</label>
          <input th:field="*{password}" type="password" id="password" placeholder="Crie uma senha segura" required/>
          <div class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Erro</div>
        </div>
        
        <div class="form-group">
          <label for="tipo">Tipo de Usuário</label>
          <select name="tipo" id="tipo">
            <option value="CLIENTE">Cliente</option>
            <option value="AGENTE">Agente</option>
          </select>
        </div>
        
        <button type="submit" class="btn btn-primary">Criar Conta</button>
      </form>
      
      <div class="footer-links">
        <p>Já tem uma conta? <a th:href="@{/login}">Fazer Login</a></p>
      </div>
    </div>
  </div>
</body>
</html>
