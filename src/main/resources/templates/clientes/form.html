<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Formulário Cliente</title>
  <link th:href="@{/css/cliente-form.css}" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <div class="form-card">
      <div class="form-header">
        <h1 th:text="${#strings.isEmpty(cliente.id) ? 'Novo Cliente' : 'Editar Cliente'}">Cliente</h1>
        <p class="subtitle">Preencha os dados do cliente</p>
      </div>
      
      <form th:action="@{/clientes/salvar}" th:object="${cliente}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" th:field="*{id}"/>
        
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" th:field="*{nome}" placeholder="Digite o nome completo" />
          <div class="error-message" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro</div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" th:field="*{cpf}" placeholder="000.000.000-00" />
            <div class="error-message" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}">Erro</div>
          </div>
          
          <div class="form-group">
            <label for="rg">RG</label>
            <input type="text" id="rg" th:field="*{rg}" placeholder="00.000.000-0" />
          </div>
        </div>
        
        <div class="form-group">
          <label for="endereco">Endereço</label>
          <input type="text" id="endereco" th:field="*{endereco}" placeholder="Rua, número, bairro, cidade" />
        </div>
        
        <div class="form-group">
          <label for="profissao">Profissão</label>
          <input type="text" id="profissao" th:field="*{profissao}" placeholder="Digite a profissão" />
        </div>
        
        <div class="form-actions">
          <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary">Salvar Cliente</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
